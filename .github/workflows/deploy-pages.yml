name: Deploy dos relatórios no Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publicar diretório dist
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Garantir projeto no Cloudflare Pages
        run: |
          if ! npx wrangler pages project list --json | grep -q '"name":"scraper-fapemig-automatico"'; then
            npx wrangler pages project create scraper-fapemig-automatico --production-branch=main
          fi

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=scraper-fapemig-automatico